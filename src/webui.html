<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>me</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0c10'/%3E%3Crect x='9' y='9' width='14' height='14' rx='3.5' fill='%238b7cff'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0c10;--bg2:#111319;--bg3:#171a23;--line:#1f2230;--fg:#d8dae3;--dim:#7b8094;--faint:#3a3d4a;--a:#8b7cff;--b:#4fd1c5;--ok:#5ad18a;--err:#ff6b7a;--warn:#ffb454;--user:#e7c66b;
  --mono:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme="light"]{--bg:#fafaf8;--bg2:#f2f2ef;--bg3:#e9e9e4;--line:#e2e2dc;--fg:#1d1e24;--dim:#62657a;--faint:#c4c5cc}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#fafaf8;--bg2:#f2f2ef;--bg3:#e9e9e4;--line:#e2e2dc;--fg:#1d1e24;--dim:#62657a;--faint:#c4c5cc}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{display:grid;grid-template-columns:260px 1fr;height:100%}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:16px;font:700 17px var(--mono)}
.brand i{width:11px;height:11px;border-radius:3px;background:linear-gradient(135deg,var(--a),var(--b))}
.brand small{font:500 11px var(--mono);color:var(--dim);margin-left:auto;padding:2px 7px;border:1px solid var(--line);border-radius:6px}
.newbtn{margin:0 12px 10px;display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;color:var(--fg)}
.newbtn:hover{background:var(--bg2)}
.slist{flex:1;overflow:auto;padding:0 8px 12px}
.slist .lbl{font:11px var(--mono);color:var(--dim);padding:10px 8px 6px;text-transform:uppercase;letter-spacing:.5px}
.si{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.si:hover{background:var(--bg2);color:var(--fg)}.si.on{background:var(--bg3);color:var(--fg)}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--dim)}
.side-foot a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:6px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:52px}
header .title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ib.menu{display:none}
.pill{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:5px 9px;white-space:nowrap}
.pill:hover{color:var(--fg)}
#chat{flex:1;overflow:auto;scroll-behavior:smooth}
.inner{max-width:820px;margin:0 auto;padding:22px 18px 30px}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--dim)}
.empty h2{font:700 34px var(--mono);letter-spacing:-1.5px;color:var(--fg);margin-bottom:6px}
.empty h2 span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.msg{margin:18px 0}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bub{background:var(--bg3);border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.md{word-break:break-word}
.md p{margin:8px 0}.md ul,.md ol{margin:8px 0 8px 22px}.md li{margin:3px 0}
.md h1,.md h2,.md h3{font-size:16px;margin:16px 0 6px;color:var(--a)}
.md code{font:12.5px var(--mono);background:var(--bg2);border:1px solid var(--line);padding:1px 5px;border-radius:5px;color:var(--b)}
.md pre{background:var(--bg2);border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
.md pre .bar{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--dim);padding:6px 12px;border-bottom:1px solid var(--line)}
.md pre code{display:block;background:none;border:none;padding:12px;overflow-x:auto;color:var(--fg);white-space:pre}
.md a{color:var(--a)}.md blockquote{border-left:3px solid var(--faint);padding-left:12px;color:var(--dim)}
.md table{border-collapse:collapse;margin:8px 0;font-size:13.5px}.md td,.md th{border:1px solid var(--line);padding:5px 9px}
.think{font-size:13px;color:var(--dim);margin:6px 0}
.think summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;font-style:italic}
.think pre{white-space:pre-wrap;font:12.5px/1.55 var(--sans);font-style:italic;margin:6px 0 0 22px;max-height:240px;overflow:auto}
.tool{border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden;background:var(--bg)}
.tool .h{display:flex;align-items:center;gap:8px;padding:8px 12px;font:12.5px var(--mono);cursor:pointer}
.tool .h b{font-weight:600}.tool .h .lab{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tool .h .t{color:var(--faint)}
.tool .body{border-top:1px solid var(--line);font:12px/1.55 var(--mono);padding:8px 12px;max-height:320px;overflow:auto;white-space:pre-wrap;color:var(--dim)}
.tool.closed .body,.tool .body:empty{display:none}
.tool .st{font:12px var(--mono);color:var(--dim);padding:0 12px 8px}
.tool .log{font:12px var(--mono);color:var(--dim);padding:0 12px 8px}
.add{color:var(--ok)}.del{color:var(--err)}
.pbar{height:6px;border-radius:4px;background:var(--line);margin:0 12px 10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--sk,var(--a));transition:width .2s}
.pbar.ind i{width:30%!important;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{margin-left:-30%}100%{margin-left:100%}}
.skill{border-color:color-mix(in srgb,var(--sk) 45%,var(--line))}
.skill .h b{color:var(--sk)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--a);border-radius:50%;animation:sp .8s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.stats{font:12px var(--mono);color:var(--dim);display:flex;align-items:center;gap:6px;margin:4px 0 22px}
.stats svg{color:var(--ok)}
.info{font:12.5px var(--mono);color:var(--dim);margin:8px 0}.info.err{color:var(--err)}.info.warn{color:var(--warn)}
.confirm{border:1px solid var(--warn);border-radius:10px;padding:12px;margin:10px 0}
.confirm pre{font:12px var(--mono);white-space:pre-wrap;color:var(--dim);margin:8px 0;max-height:200px;overflow:auto}
.confirm .btns{display:flex;gap:8px}
.btn{padding:7px 13px;border-radius:8px;font:500 12.5px var(--mono);background:var(--a);color:#fff}
.btn.ghost{background:none;color:var(--dim);border:1px solid var(--line)}
.working{display:flex;align-items:center;gap:8px;font:12.5px var(--mono);color:var(--dim);margin:10px 0}
.shimmer{background:linear-gradient(90deg,var(--dim) 30%,var(--fg) 50%,var(--dim) 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.6s linear infinite}
@keyframes sh{from{background-position:150% 0}to{background-position:-50% 0}}
.composer{padding:0 18px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.box{max-width:820px;margin:0 auto;border:1px solid var(--line);border-radius:14px;background:var(--bg2);transition:border-color .15s}
.box:focus-within{border-color:var(--a)}
textarea{width:100%;background:none;border:none;outline:none;resize:none;color:var(--fg);font:15px/1.5 var(--sans);padding:12px 14px 4px;max-height:220px}
.row{display:flex;align-items:center;gap:6px;padding:6px 8px 8px}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--dim)}
.ib:hover{background:var(--bg3);color:var(--fg)}
.ib.rec{background:var(--err);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.send{background:var(--a);color:#fff}.send:hover{background:var(--a);filter:brightness(1.1);color:#fff}
.send:disabled{opacity:.35;cursor:default}
.spacer{flex:1}
.status{max-width:820px;margin:8px auto 0;display:flex;gap:14px;align-items:center;font:11.5px var(--mono);color:var(--dim);flex-wrap:wrap}
.ctx{display:flex;align-items:center;gap:6px}.ctx .bar{width:70px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.ctx .bar i{display:block;height:100%;background:var(--ok)}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:20}
.popup>div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px;width:min(420px,100%);max-height:70vh;overflow:auto}
.popup button{display:flex;width:100%;text-align:left;padding:9px 12px;border-radius:8px;gap:10px;align-items:center}
.popup button:hover{background:var(--bg2)}.popup .d{color:var(--dim);font-size:12px;margin-left:auto}
.hidden{display:none!important}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{position:fixed;inset:0 25% 0 0;z-index:15;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 60px rgba(0,0,0,.5)}
  aside.open{transform:none}.ib.menu{display:grid}.inner{padding:16px 14px}.composer{padding:0 10px 10px}}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="brand"><i></i>me<small id="mode"></small></div>
  <button class="newbtn" onclick="newChat()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
  <div class="slist" id="slist"></div>
  <div class="side-foot"><a id="acct" href="/account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span id="who">account</span></a>
    <span class="spacer"></span><button class="ib" onclick="toggleTheme()" title="theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
</aside>
<main>
  <header>
    <button class="ib menu" onclick="side.classList.toggle('open')"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="title" id="title">New chat</div>
    <button class="pill" id="wsPill" title="workspace"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span id="ws">—</span></button>
  </header>
  <div id="chat"><div class="inner" id="log"></div></div>
  <div class="composer">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Ask anything…"></textarea>
      <div class="row">
        <button class="pill" id="modelBtn" onclick="pickModel()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg><span id="model">model</span></button>
        <span class="spacer"></span>
        <button class="ib" id="mic" title="hold to talk"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="ib send" id="send" onclick="sendOrStop()" disabled><svg viewBox="0 0 24 24" id="sendIcon"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </div>
    <div class="status"><span class="ctx" id="ctx"></span><span id="tok"></span><span id="sync"></span></div>
  </div>
</main>
</div>
<div class="popup hidden" id="popup" onclick="if(event.target===this)this.classList.add('hidden')"><div id="pbody"></div></div>
<script>
const MODE = "__MODE__";
const $ = id => document.getElementById(id);
const side = $("side");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const human = n => !n ? "0" : n < 1000 ? String(n) : n < 1e6 ? (n / 1000).toFixed(1).replace(".0", "") + "k" : (n / 1e6).toFixed(1).replace(".0", "") + "M";
const dur = s => s < 60 ? s.toFixed(1) + "s" : Math.floor(s / 60) + "m" + String(Math.floor(s % 60)).padStart(2, "0") + "s";
const COLORS = {red:"#ff6b7a",green:"#5ad18a",blue:"#6ba6ff",magenta:"#d27cff",cyan:"#4fd1c5",yellow:"#e7c66b",orange:"#ffb454",purple:"#8b7cff",pink:"#ff8fc7"};
const I = {
  check: '<svg viewBox="0 0 24 24" style="color:var(--ok)"><path d="M5 12l5 5 9-11"/></svg>',
  x: '<svg viewBox="0 0 24 24" style="color:var(--err)"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  stop: '<path d="M7 7h10v10H7z" fill="currentColor"/>', up: '<path d="M12 19V5M5 12l7-7 7 7"/>',
  think: '<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5V16h8v-2.5A6 6 0 0 0 12 3z"/></svg>',
};
let token = localStorage.getItem("me_token") || "", base = "", after = 0, state = {}, busy = false, live = {}, cur = {}, polling = 0, turnT0 = 0;

// ─── transport: identical endpoints for local (`me web`) and cloud (/app) ───
async function api(path, body, method) {
  const h = {"Content-Type": "application/json"};
  if (token) h.Authorization = "Bearer " + token;
  const r = await fetch(path, {method: method || (body !== undefined ? "POST" : "GET"), headers: h, body: body !== undefined ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && MODE === "cloud") { location.href = "/account#cloud"; throw new Error("login"); }
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
const A = {
  async boot() {
    if (MODE === "local") {
      const k = new URLSearchParams(location.search).get("k"); if (k) { token = k; localStorage.setItem("me_token", k); }
      base = "/api/agent"; return api(base + "/state");
    }
    if (!token) { location.href = "/account#cloud"; return; }
    const q = new URLSearchParams(location.search);
    let w;
    if (q.get("s") || q.get("ws")) w = await api("/api/cloud", {session: q.get("s"), ws: q.get("ws")});
    else w = (await api("/api/cloud"))[0] || await api("/api/cloud", {});
    return A.attach(w);
  },
  async attach(w) { base = "/api/cloud/" + w.id; after = 0; return A.state(w); },
  async state(w) {
    if (MODE === "local") return api(base + "/state");
    const [cfg, sessions, me] = await Promise.all([api("/api/doc?key=config").then(d => JSON.parse(d.content)).catch(() => ({})), api("/api/sessions"), api("/api/me")]);
    let session = null;
    if (w && w.session) session = await api("/api/doc?key=" + encodeURIComponent("session/" + w.session)).then(d => JSON.parse(d.content)).catch(() => null);
    return {mode: "cloud", user: me.username, config: {model: cfg.model, models: cfg.models || []}, sessions, session, ws: w && w.ws, worker: w};
  },
  async load(id) {
    if (MODE === "local") { await api(base + "/load", {id}); return api(base + "/state"); }
    const w = await api("/api/cloud", {session: id}); return A.attach(w);
  },
  async newChat() { await api(base + "/new", {}); return A.state(state.worker); },
  async setModel(name) {
    if (MODE === "local") return api(base + "/model", {name});
    const d = await api("/api/doc?key=config"); const cfg = JSON.parse(d.content); cfg.model = name;
    await api("/api/doc", {key: "config", content: JSON.stringify(cfg, null, 1)}, "PUT"); await api(base + "/sync", {});
  },
  voice: (blob) => fetch(MODE === "local" ? "/api/agent/voice" : "/api/voice", {method: "POST", headers: {"Content-Type": blob.type, ...(token ? {Authorization: "Bearer " + token} : {})}, body: blob}).then(r => r.json()),
};

// ─── markdown ───
function md(src) {
  const blocks = [];
  src = src.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g, (_, lang, code) => { blocks.push([lang, code]); return `\u0000${blocks.length - 1}\u0000`; });
  let h = esc(src)
    .replace(/^### (.*)$/gm, "<h3>$1</h3>").replace(/^## (.*)$/gm, "<h2>$1</h2>").replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>")
    .replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|\W)\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/(?:^|\n)((?:[-*] .*(?:\n|$))+)/g, (_, l) => "\n<ul>" + l.trim().split("\n").map(x => "<li>" + x.slice(2) + "</li>").join("") + "</ul>\n");
  h = h.replace(/(?:^|\n)((?:\d+[.)] .*(?:\n|$))+)/g, (_, l) => "\n<ol>" + l.trim().split("\n").map(x => "<li>" + x.replace(/^\d+[.)] /, "") + "</li>").join("") + "</ol>\n");
  h = h.split(/\n{2,}/).map(p => /^\s*<(h\d|ul|ol|blockquote|\u0000)/.test(p) || p.startsWith("\u0000") ? p : "<p>" + p.replace(/\n/g, "<br>") + "</p>").join("");
  return h.replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre><div class="bar"><span>${esc(blocks[i][0] || "code")}</span><button onclick="navigator.clipboard.writeText(this.closest('pre').querySelector('code').innerText)">copy</button></div><code>${esc(blocks[i][1])}</code></pre>`);
}

// ─── rendering ───
const log = $("log"), chat = $("chat");
let stick = true;
chat.addEventListener("scroll", () => stick = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80);
function scroll() { if (stick) chat.scrollTop = chat.scrollHeight; }
let workEl = null;
function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); const n = d.firstChild; workEl && workEl.parentNode === log ? log.insertBefore(n, workEl) : log.appendChild(n); scroll(); return n; }
function clearLog() { log.innerHTML = ""; live = {}; cur = {}; workEl = null; }
function emptyState() {
  log.innerHTML = `<div class="empty" style="min-height:60vh"><div><h2>what are we <span>building?</span></h2><p>${MODE === "cloud" ? "Runs in your cloud sandbox · files sync to all your machines" : "Running locally on this machine"}</p></div></div>`;
}
function userMsg(t) { if (log.querySelector(".empty")) log.innerHTML = ""; el(`<div class="msg user"><div class="bub">${esc(t)}</div></div>`); }
function toolCard(name, label, args, skill) {
  const isSkill = name === "skill" && args && args.action;
  const color = isSkill ? (COLORS[skill?.color] || "var(--a)") : "var(--a)";
  const title = isSkill ? `${esc(args.name)} · ${esc(args.action)}` : esc(name);
  return el(`<div class="tool ${isSkill ? "skill" : ""} closed" style="--sk:${color}"><div class="h" onclick="this.parentNode.classList.toggle('closed')"><span class="ic"><span class="spin"></span></span><b>${title}</b><span class="lab">${esc(isSkill ? JSON.stringify(args.args || {}) : label)}</span><span class="t"></span></div><div class="st hidden"></div><div class="pbar hidden"><i></i></div><div class="log hidden"></div><div class="body"></div></div>`);
}
function diffHtml(t) { return t.split("\n").map(l => `<span class="${l[0] === "+" ? "add" : l[0] === "-" ? "del" : ""}">${esc(l)}</span>`).join("\n"); }
function onEvent(e) {
  const t = e.type;
  if (t === "user") { if (!cur.echo) userMsg(e.text); cur.echo = false; return; }
  if (t === "turn_start") { busy = true; turnT0 = Date.now(); setBusy(); return; }
  if (t === "reasoning") {
    if (!cur.think) { cur.think = el(`<details class="think"><summary>${I.think}<span class="shimmer">thinking…</span></summary><pre></pre></details>`); cur.thinkT = Date.now(); }
    cur.think.querySelector("pre").textContent += e.text; scroll(); return;
  }
  const endThink = () => { if (cur.think && !cur.thinkDone) { cur.think.querySelector("summary span").outerHTML = `<span>thought for ${dur((Date.now() - cur.thinkT) / 1000)}</span>`; cur.thinkDone = true; } };
  if (t === "text") {
    endThink();
    if (!cur.text) { cur.text = el(`<div class="msg md"></div>`); cur.raw = ""; }
    cur.raw += e.text; cur.text.innerHTML = md(cur.raw); scroll(); return;
  }
  if (t === "tool_start") {
    endThink(); cur.text = null; cur.think = null; cur.thinkDone = false;
    live[e.id] = toolCard(e.name, e.label, e.args, e.skill); return;
  }
  if (t === "tool_event") {
    const c = live[e.id]; if (!c) return;
    if (e.t === "status") { const s = c.querySelector(".st"); s.classList.remove("hidden"); s.textContent = e.text; }
    else if (e.t === "progress") { const p = c.querySelector(".pbar"); p.classList.remove("hidden"); p.classList.toggle("ind", e.v == null); if (e.v != null) p.firstChild.style.width = Math.round(e.v * 100) + "%"; }
    else if (e.t === "diff" && e.text.trim()) { c.querySelector(".body").innerHTML = diffHtml(e.text); c.classList.remove("closed"); }
    else { const l = c.querySelector(".log"); l.classList.remove("hidden"); l.textContent = ("› " + e.text + "\n" + l.textContent).split("\n").slice(0, 3).join("\n"); }
    scroll(); return;
  }
  if (t === "tool_end") {
    const c = live[e.id]; if (!c) return; delete live[e.id];
    c.querySelector(".ic").innerHTML = e.ok ? I.check : I.x; c.querySelector(".t").textContent = dur(e.time);
    c.querySelectorAll(".st,.pbar,.log").forEach(x => x.classList.add("hidden"));
    const b = c.querySelector(".body"); if (!b.innerHTML) b.textContent = (e.output || "").slice(0, 20000);
    if (!e.ok) c.classList.remove("closed");
    return;
  }
  if (t === "confirm") {
    const c = el(`<div class="confirm"><b>Allow ${esc(e.name)}?</b><pre>${esc(JSON.stringify(e.args, null, 1)).slice(0, 3000)}</pre><div class="btns"><button class="btn">allow</button><button class="btn ghost">deny</button></div></div>`);
    const [y, n] = c.querySelectorAll("button");
    y.onclick = () => { api(base + "/confirm", {id: e.id, ok: true}); c.remove(); };
    n.onclick = () => { api(base + "/confirm", {id: e.id, ok: false}); c.remove(); };
    return;
  }
  if (t === "usage") { state.ctx = e.ctx; renderStatus(e.in, e.out); return; }
  if (t === "error") { el(`<div class="info ${e.text === "interrupted" ? "warn" : "err"}">${esc(e.text)}</div>`); return; }
  if (t === "turn_end") {
    endThink(); busy = false; cur = {}; setBusy();
    el(`<div class="stats">${I.check}${dur(e.time)} · ↑ ${human(e.in)} ↓ ${human(e.out)} · ${human(e.in + e.out)} tokens</div>`);
    state.ctx = e.ctx; renderStatus(); refreshSessions(); return;
  }
  if (t === "loaded" && e.title) $("title").textContent = e.title;
  if (t === "exit") { el(`<div class="info warn">sandbox stopped — send a message to restart</div>`); busy = false; setBusy(); }
}
function renderHistory(s) {
  clearLog();
  if (!s || !s.messages || !s.messages.length) return emptyState();
  const txt = c => Array.isArray(c) ? c.filter(x => x.type === "text").map(x => x.text).join(" ") : (c || "");
  const outs = {};
  s.messages.forEach(m => { if (m.role === "tool") outs[m.tool_call_id] = m.content; });
  s.messages.forEach(m => {
    if (m.role === "user" && txt(m.content) !== "(images from read)") userMsg(txt(m.content));
    else if (m.role === "assistant") {
      if (m.content) el(`<div class="msg md">${md(m.content)}</div>`);
      (m.tool_calls || []).forEach(tc => {
        let a = {}; try { a = JSON.parse(tc.function.arguments); } catch (e) {}
        const c = toolCard(tc.function.name, a.path || a.cmd || a.pattern || a.query || a.url || a.name || "", a);
        c.querySelector(".ic").innerHTML = I.check; c.querySelector(".body").textContent = String(outs[tc.id] || "").slice(0, 8000);
      });
    }
  });
  $("title").textContent = s.title || "Chat";
  setTimeout(() => chat.scrollTop = chat.scrollHeight, 0);
}
function renderStatus(tin, tout) {
  const m = (state.config?.models || []).find(x => x.name === state.config?.model);
  $("model").textContent = m ? m.name + (m.effort ? " · " + m.effort : "") : "no model";
  const ctx = m?.context || 0, used = state.ctx || 0, f = ctx ? Math.min(1, used / ctx) : 0;
  const col = f < .6 ? "var(--ok)" : f < .85 ? "var(--warn)" : "var(--err)";
  $("ctx").innerHTML = ctx ? `ctx <span class="bar"><i style="width:${(f * 100).toFixed(1)}%;background:${col}"></i></span> ${human(used)}/${human(ctx)} ${Math.round(f * 100)}%` : `ctx ${human(used)}`;
  const u = state.session?.usage || {};
  $("tok").textContent = tin !== undefined ? `this task ↑${human(tin)} ↓${human(tout)}` : `session ↑${human(u.in)} ↓${human(u.out)}`;
  $("ws").textContent = state.ws || (MODE === "local" ? (state.cwd || "local").split(/[\\/]/).pop() : "cloud");
}
function renderSessions() {
  const ss = state.sessions || [], sid = state.session?.id;
  const groups = {};
  ss.forEach(s => { const d = new Date((s.updated || 0) * 1000), age = (Date.now() - d) / 864e5;
    const g = age < 1 ? "Today" : age < 7 ? "This week" : "Older"; (groups[g] ??= []).push(s); });
  $("slist").innerHTML = Object.entries(groups).map(([g, l]) => `<div class="lbl">${g}</div>` + l.map(s =>
    `<button class="si ${s.id === sid ? "on" : ""}" onclick="loadSession('${esc(s.id)}')" title="${esc(s.cwd || "")}">${esc(s.title || "(untitled)")}</button>`).join("")).join("") || '<div class="lbl">no chats yet</div>';
}
async function refreshSessions() { try { const s = await A.state(state.worker); state.sessions = s.sessions; if (!state.session || state.session.id === s.session?.id) state.session = s.session || state.session; renderSessions(); } catch (e) {} }
function setBusy() {
  $("sendIcon").innerHTML = busy ? I.stop : I.up;
  $("send").disabled = !busy && !$("input").value.trim();
  if (busy && (!workEl || workEl.parentNode !== log)) {
    workEl = document.createElement("div"); workEl.className = "working";
    workEl.innerHTML = '<span class="spin"></span><span class="shimmer">working…</span><span class="el"></span>'; log.appendChild(workEl); scroll();
  }
  if (!busy && workEl) { workEl.remove(); workEl = null; }
}
setInterval(() => { const w = document.querySelector(".working .el"); if (w && busy) w.textContent = dur((Date.now() - turnT0) / 1000); }, 200);

// ─── actions ───
async function poll() {
  const my = ++polling;
  while (my === polling) {
    try {
      const r = await api(`${base}/events?after=${after}`);
      if (my !== polling) return;
      for (const e of r.events) { after = Math.max(after, e.seq); onEvent(e); }
      if (r.state) { busy = r.state.busy; setBusy(); }
    } catch (e) {
      if (MODE === "cloud" && /no such cloud session/.test(e.message)) { const w = await api("/api/cloud", {session: state.session?.id}); await A.attach(w); continue; }
      await new Promise(r => setTimeout(r, 2000));
    }
  }
}
async function apply(s, history = true) {
  state = s; if (history) renderHistory(s.session); renderSessions(); renderStatus();
  $("mode").textContent = MODE === "cloud" ? "cloud" : "local";
  $("who").textContent = s.user || (MODE === "local" ? "local" : "account");
  after = s.after ?? after;
  if (s.busy) { busy = true; turnT0 = Date.now(); setBusy(); }
  (s.pending || []).forEach(onEvent);
  poll();
}
async function send() {
  const t = $("input").value.trim(); if (!t || busy) return;
  $("input").value = ""; grow(); userMsg(t);
  if ($("title").textContent === "New chat") $("title").textContent = t.split("\n")[0].slice(0, 60); cur.echo = true; busy = true; turnT0 = Date.now(); setBusy(); stick = true;
  try { await api(base + "/prompt", {text: t}); } catch (e) { el(`<div class="info err">${esc(e.message)}</div>`); busy = false; setBusy(); }
}
function sendOrStop() { busy ? api(base + "/cancel", {}) : send(); }
async function newChat() { side.classList.remove("open"); await apply(await A.newChat()); history.replaceState(null, "", location.pathname); $("title").textContent = "New chat"; }
async function loadSession(id) { side.classList.remove("open"); polling++; await apply(await A.load(id)); if (MODE === "cloud") history.replaceState(null, "", "?s=" + id); }
function pickModel() {
  const ms = state.config?.models || [];
  $("pbody").innerHTML = ms.map(m => `<button onclick="setModel('${esc(m.name)}')"><span>${m.name === state.config.model ? "●" : "○"}</span>${esc(m.name)}<span class="d">${esc(m.id)}</span></button>`).join("") || '<p style="padding:12px;color:var(--dim)">No models — add one in your account or with /models.</p>';
  $("popup").classList.remove("hidden");
}
async function setModel(n) { $("popup").classList.add("hidden"); await A.setModel(n); state.config.model = n; renderStatus(); }
function toggleTheme() { const r = document.documentElement, d = r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches); r.dataset.theme = d ? "light" : "dark"; localStorage.setItem("me_theme", r.dataset.theme); }
if (localStorage.getItem("me_theme")) document.documentElement.dataset.theme = localStorage.getItem("me_theme");
const inp = $("input");
function grow() { inp.style.height = "auto"; inp.style.height = Math.min(220, inp.scrollHeight) + "px"; setBusy(); }
inp.addEventListener("input", grow);
inp.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && innerWidth > 760) { e.preventDefault(); send(); } if (e.key === "Escape" && busy) api(base + "/cancel", {}); });
// voice: hold the mic button (or hold space in an empty input)
let rec = null, chunks = [];
async function recStart() {
  if (rec) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    rec = new MediaRecorder(stream); chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); $("mic").classList.remove("rec");
      const blob = new Blob(chunks, {type: rec.mimeType || "audio/webm"}); rec = null;
      if (blob.size < 2000) return;
      inp.placeholder = "transcribing…";
      try { const r = await A.voice(blob); if (r.text) { inp.value += (inp.value && !inp.value.endsWith(" ") ? " " : "") + r.text; grow(); inp.focus(); } else if (r.detail) alert(r.detail); }
      finally { inp.placeholder = "Ask anything…"; }
    };
    rec.start(); $("mic").classList.add("rec");
  } catch (e) { alert("microphone: " + e.message); }
}
function recStop() { if (rec && rec.state === "recording") rec.stop(); }
const mic = $("mic");
mic.addEventListener("pointerdown", e => { e.preventDefault(); recStart(); });
["pointerup", "pointerleave", "pointercancel"].forEach(ev => mic.addEventListener(ev, recStop));
let spaceT = 0;
inp.addEventListener("keydown", e => { if (e.code === "Space" && !inp.value && e.repeat) { e.preventDefault(); if (!rec) recStart(); } });
inp.addEventListener("keyup", e => { if (e.code === "Space") recStop(); });
$("wsPill").onclick = () => { if (MODE === "cloud") location.href = "/account#workspaces"; };
A.boot().then(s => s && apply(s)).catch(e => el(`<div class="info err">${esc(e.message)}</div>`));
</script>
