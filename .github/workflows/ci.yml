name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python build.py --check
      - run: python -c "import ast,sys; [ast.parse(open(f).read()) for f in sys.argv[1:]]" server/*.py server/market/*.py
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: web UI and IDE extension JS parse
        run: |
          for f in src/web/*.js apps/studio/studio.js $(ls apps/vscode/*.js 2>/dev/null); do node --check "$f"; done
  test:
    # me.py promises Python 3.8+ on every OS: a syntax that only 3.12 accepts once broke every Windows install on 3.11
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.11", "3.13"]
        exclude:
          - {os: macos-latest, python: "3.8"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: python tests/test_core.py
        env: {PYTHONIOENCODING: utf-8}
      - name: end-to-end TUI in a pty
        if: runner.os != 'Windows'
        run: pip install pyte && python tests/test_tui.py
      - run: python tests/test_terminal.py
        env: {PYTHONIOENCODING: utf-8}
      - run: python tests/test_studio.py
        env: {PYTHONIOENCODING: utf-8}
