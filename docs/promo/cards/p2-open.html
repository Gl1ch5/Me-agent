<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>me promo card · p2-open</title>
<meta name="viewport" content="width=1920">
<style>
:root{--bg:#0e0f13;--bg2:#111319;--line:#1f2230;--fg:#d8dae3;--dim:#6b6f80;--accent:#8b7cff;--accent2:#4fd1c5}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
.card{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:0 9%;position:relative}
.logo{font-family:"DejaVu Sans Mono",monospace;font-weight:700;color:var(--fg);letter-spacing:.02em}
.logo i{display:inline-block;width:.6em;height:.6em;border-radius:.12em;margin-right:.45em;background:linear-gradient(135deg,var(--accent),var(--accent2))}
h1{margin:0;font:700 var(--h1,96px)/1.05 "DejaVu Sans Mono",monospace;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--accent)}
.en{font-size:var(--sub,40px);color:var(--dim);margin:0}
.ru{font-size:var(--sub,40px);color:var(--fg);margin:0}
.cmd{font:500 var(--cmd,34px)/1.4 "DejaVu Sans Mono",monospace;background:var(--bg2);border:2px solid var(--line);border-radius:18px;padding:24px 30px;color:var(--fg);display:inline-block;align-self:flex-start}
.cmd b{color:var(--accent2);font-weight:500}
.foot{position:absolute;left:9%;bottom:7%;font:400 26px "DejaVu Sans Mono",monospace;color:var(--dim)}

body{width:1920px;height:1080px} .card{--h1:96px;--sub:40px;--cmd:34px}
</style></head>
<body><div class="card">
<div class="logo"><i></i>me</div><h1>продолжи <em>на телефоне</em></h1><p class="ru">сессия на ПК → открыта на телефоне → сообщение с телефона появляется на ПК</p><p class="en">PC session → open on the phone → the phone message appears on the PC</p>
</div></body></html>
