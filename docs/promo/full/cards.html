<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>me promo · animated cards</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Animated title cards for the full promo. Open with ?card=intro|phonecard|outro&lang=ru|en&v=0|1 (v=1: 9:16).
     Colours are the me-dark palette. Recorded by scripts/promo/full.py with playwright (video=on). -->
<style>
:root{--bg:#0e0f13;--bg2:#111319;--line:#1f2230;--fg:#d8dae3;--dim:#6b6f80;--accent:#8b7cff;--accent2:#4fd1c5}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif}
.card{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:var(--gap,28px);padding:0 9%;position:relative}
.logo{font:700 var(--logo,64px)/1 "DejaVu Sans Mono",monospace;display:flex;align-items:center;gap:.35em;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.logo i{display:inline-block;width:.55em;height:.55em;border-radius:.14em;background:linear-gradient(135deg,var(--accent),var(--accent2));animation:spin 2.4s ease-in-out .3s both}
h1{margin:0;font:700 var(--h1,104px)/1.05 "DejaVu Sans Mono",monospace;letter-spacing:-.01em}
h1 .w{display:inline-block;opacity:0;transform:translateY(.4em);animation:up .6s ease-out forwards}
h1 em{font-style:normal;color:var(--accent)}
.sub{font-size:var(--sub,40px);color:var(--dim);margin:0;opacity:0;animation:fade .8s ease-out 1.4s forwards}
.sub.ru{color:var(--fg)}
.rule{height:3px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;animation:sweep 1.1s ease-in-out .9s forwards}
.cmd{font:500 var(--cmd,36px)/1.4 "DejaVu Sans Mono",monospace;background:var(--bg2);border:2px solid var(--line);border-radius:18px;padding:24px 30px;align-self:flex-start;opacity:0;transform:scale(.96);animation:fade .7s ease-out 2s forwards,zoom .7s ease-out 2s forwards}
.cmd b{color:var(--accent2);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:12px;opacity:0;animation:fade .8s ease-out 2.4s forwards}
.chips span{font:500 var(--chip,30px) "DejaVu Sans Mono",monospace;border:2px solid var(--line);border-radius:999px;padding:8px 20px;color:var(--dim)}
.chips span:nth-child(1){border-color:var(--accent);color:var(--fg)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:drift 9s ease-in-out infinite alternate}
.orb.a{width:55vmax;height:55vmax;background:var(--accent);left:-18vmax;top:-20vmax}
.orb.b{width:45vmax;height:45vmax;background:var(--accent2);right:-16vmax;bottom:-18vmax;animation-delay:-4s}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes spin{from{transform:rotate(-180deg) scale(.2)}to{transform:none}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes zoom{to{transform:none}}
@keyframes sweep{to{width:100%}}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.1)}}
</style></head>
<body><div class="orb a"></div><div class="orb b"></div>
<div class="card" id="card"></div>
<script>
const q = new URLSearchParams(location.search);
const L = q.get("lang") === "en" ? "en" : "ru";
const V = q.get("v") === "1";
const T = {
  ru: {
    intro: {logo: "me", h1: ["один агент.", "<em>все</em> устройства."], sub: ["кодинг-агент в одном файле", "без зависимостей · на вашей машине и в облаке"], subEn: "a coding agent in one file · no dependencies"},
    phonecard: {h1: ["продолжи", "<em>на телефоне</em>"], sub: ["сессия на ПК — открыта на телефоне", "и ответ с телефона уже на ПК"], subEn: "PC session → open on the phone → reply lands on the PC"},
    outro: {logo: "me", h1: ["ставится", "<em>одной строкой</em>"], cmd: "curl -fsSL https://me-agent.ru/i | sh", chips: ["темы", "режимы", "голос", "маркетплейс"], sub: ["me-agent.ru", ""], subEn: "themes · modes · voice · marketplace"},
  },
  en: {
    intro: {logo: "me", h1: ["one agent.", "<em>every</em> device."], sub: ["a coding agent in one file", "no dependencies · on your machine and in the cloud"], subEn: "a coding agent in one file · no dependencies"},
    phonecard: {h1: ["continue", "<em>on your phone</em>"], sub: ["PC session — open on the phone", "and the reply from the phone is already on the PC"], subEn: "PC session → open on the phone → reply lands on the PC"},
    outro: {logo: "me", h1: ["install", "<em>in one line</em>"], cmd: "curl -fsSL https://me-agent.ru/i | sh", chips: ["themes", "modes", "voice", "marketplace"], sub: ["me-agent.ru", ""], subEn: "themes · modes · voice · marketplace"},
  },
};
const c = T[L][q.get("card") || "intro"];
const words = (line, delay) => line.split(" ").map((w, i) => `<span class="w" style="animation-delay:${delay + i * 0.12}s">${w}</span>`).join(" ");
const h1 = c.h1.map((line, i) => `<div>${words(line, 0.25 + i * 0.5)}</div>`).join("");
const sub = (c.sub || []).filter(Boolean).map((s, i) => `<p class="sub ${i === 0 ? "ru" : ""}">${s}</p>`).join("");
document.getElementById("card").innerHTML = `
  ${c.logo ? `<div class="logo"><i></i>${c.logo}</div>` : ""}
  <h1 style="--h1:${V ? 150 : 104}px">${h1}</h1>
  <div class="rule"></div>
  ${sub}
  ${c.cmd ? `<div class="cmd"><b>$</b> ${c.cmd}</div>` : ""}
  ${c.chips ? `<div class="chips">${c.chips.map(x => `<span>${x}</span>`).join("")}</div>` : ""}
  <p class="sub" style="font-size:${V ? 52 : 34}px;opacity:0;animation-delay:3s">${L === "en" ? c.subEn : (c.subEn || "")}</p>`;
if (V) document.getElementById("card").style.setProperty("--gap", "40px");
</script></body></html>
