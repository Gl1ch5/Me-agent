# Published sites on their own hosts: https://<site>.<user>.me-agent.ru/ (needs DNS: *.me-agent.ru A <server ip>).
# One certificate per host, issued by site-certs.sh into /etc/letsencrypt/live/<host>/ and picked per handshake by SNI.
server {
    listen 80;
    server_name ~^[a-z0-9-]+\.[a-z0-9-]+\.me-agent\.ru$;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name ~^[a-z0-9-]+\.[a-z0-9-]+\.me-agent\.ru$;
    ssl_certificate /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    location / { proxy_pass http://127.0.0.1:8790; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
