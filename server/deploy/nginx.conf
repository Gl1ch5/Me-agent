# Legacy IP access (old installs); the public site is https://me-agent.ru (certbot --nginx -d me-agent.ru -d www.me-agent.ru)
server {
    listen 7777;
    client_max_body_size 50m;
    location / { proxy_pass http://127.0.0.1:8790; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; }
}
server {
    listen 443 ssl;
    server_name me-agent.ru www.me-agent.ru;
    client_max_body_size 50m;
    ssl_certificate /etc/letsencrypt/live/me-agent.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/me-agent.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    location / { proxy_pass http://127.0.0.1:8790; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; proxy_buffering off; }
}
server {
    listen 80;
    server_name me-agent.ru www.me-agent.ru;
    return 301 https://$host$request_uri;
}
