# IP access until DNS/TLS is ready
server {
    listen 7777;
    client_max_body_size 50m;
    location / { proxy_pass http://127.0.0.1:8790; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; }
}
server {
    listen 80;
    server_name me-agent.ru www.me-agent.ru;
    client_max_body_size 50m;
    location / { proxy_pass http://127.0.0.1:8790; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 120s; }
}
